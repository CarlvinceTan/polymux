backend:
  name: github
  repo: CarlvinceTan/polymux
  branch: dev
  auth_methods: [token]

site_url: https://polymux.com
display_url: https://polymux.com
logo_url: https://polymux.com/favicon-32.png
media_folder: apps/site/public/blog/uploads
public_folder: /blog/uploads

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: apps/site/src/content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields.slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - {name: title, label: Title, widget: string}
      - {name: slug, label: URL slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase words separated by hyphens']}
      - {name: date, label: Publish date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {name: author, label: Author, widget: string, default: Carlvince Tan}
      - {name: excerpt, label: Excerpt, widget: text}
      - {name: tags, label: Tags, widget: list, required: false, default: []}
      - {name: coverImage, label: Cover image, widget: image, required: false}
      - {name: published, label: Published, widget: boolean, default: true}
      - {name: body, label: Article, widget: markdown}

  - name: docs
    label: Documentation
    label_singular: Documentation page
    folder: apps/site/src/content/docs
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "{{fields.slug}}"
    summary: "{{section}} — {{title}}"
    sortable_fields: [sectionOrder, order, title]
    fields:
      - {name: title, label: Title, widget: string}
      - {name: slug, label: URL slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Use lowercase words separated by hyphens']}
      - {name: description, label: Search and page description, widget: text}
      - {name: section, label: Navigation section, widget: select, options: [Getting started, Using Polymux, Customising Polymux, Help]}
      - {name: sectionOrder, label: Section order, widget: number, value_type: int, min: 1}
      - {name: order, label: Page order, widget: number, value_type: int, min: 1}
      - {name: published, label: Published, widget: boolean, default: true}
      - {name: body, label: Documentation, widget: markdown}

  - name: releases
    label: Releases
    label_singular: Release
    folder: apps/site/src/content/releases
    create: true
    extension: md
    format: yaml-frontmatter
    slug: "v{{fields.version}}"
    summary: "v{{version}} — {{title}}"
    sortable_fields: [date, version, title]
    fields:
      - {name: version, label: Version, widget: string, pattern: ['^\\d+(?:\\.\\d+)+(?:-[0-9A-Za-z.-]+)?$', 'Use a version such as 0.2.2']}
      - {name: title, label: Release title, widget: string}
      - {name: date, label: Release date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD}
      - {name: summary, label: Summary, widget: text}
      - {name: published, label: Published, widget: boolean, default: true}
      - {name: body, label: Release notes, widget: markdown}
