name: Development updates

# Keep delivery manual while TestFlight credentials and first-install checks are pending.
on:
  workflow_dispatch:
    inputs:
      ios:
        description: Upload an iOS build to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: development-updates
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/dev' && github.repository == 'CarlvinceTan/polymux'
    uses: ./.github/workflows/tests.yml

  version:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      ios: ${{ steps.version.outputs.ios }}
      macos: ${{ steps.version.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: python3 scripts/dev-version.py "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  ios:
    if: inputs.ios
    needs: version
    runs-on: xcode-27
    environment: development
    env:
      POLYMUX_BUILD_NUMBER: ${{ needs.version.outputs.ios }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      POLYMUX_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          for name in ASC_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID POLYMUX_TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          umask 077
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive iOS
        run: scripts/testflight.sh archive
      - name: Upload to internal TestFlight only
        run: scripts/testflight.sh upload
      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  macos:
    needs: version
    runs-on: xcode-27
    environment: development
    permissions:
      contents: write
    env:
      POLYMUX_BUILD_NUMBER: ${{ needs.version.outputs.macos }}
      POLYMUX_FEED_URL: https://github.com/CarlvinceTan/polymux/releases/download/dev-updates/appcast.xml
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CERT_P12 CERT_PASSWORD TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          umask 077
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/macos.p12"
          KEYCHAIN="$RUNNER_TEMP/macos-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/macos.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          test -n "$IDENTITY"
          echo "POLYMUX_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "POLYMUX_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Build signed development app
        run: scripts/build.sh macos
      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          APP=dist/macos/Polymux.app
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist")" = "$POLYMUX_FEED_URL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$POLYMUX_BUILD_NUMBER"
          ditto -c -k --keepParent "$APP" "dist/macos/Polymux-dev-$POLYMUX_BUILD_NUMBER.zip"
      - name: Sign development feed
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is missing.'; exit 1; }
          SPARKLE=.build/xcode-release/SourcePackages/artifacts/sparkle/Sparkle/bin
          mkdir -p dist/dev-updates
          mv "dist/macos/Polymux-dev-$POLYMUX_BUILD_NUMBER.zip" dist/dev-updates/
          printf '%s' "$SPARKLE_KEY" | "$SPARKLE/generate_appcast" --ed-key-file - \
            --download-url-prefix 'https://github.com/CarlvinceTan/polymux/releases/download/dev-updates/' \
            dist/dev-updates
          grep -q 'edSignature=' dist/dev-updates/appcast.xml
      - name: Publish development update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dev-updates >/dev/null 2>&1; then
            gh release create dev-updates --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Polymux development updates' --notes 'Development builds from passing dev commits.'
          fi
          # Keep versioned payloads immutable; switch the feed only after the payload is available.
          gh release upload dev-updates "dist/dev-updates/Polymux-dev-$POLYMUX_BUILD_NUMBER.zip" dist/symbols/*.dSYM.zip
          gh release upload dev-updates dist/dev-updates/appcast.xml --clobber
          gh release edit dev-updates --prerelease --latest=false \
            --notes "Build $POLYMUX_BUILD_NUMBER from commit $GITHUB_SHA. Internal development channel."
      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/macos-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/macos.p12"
