name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: polymux-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      swift: ${{ steps.paths.outputs.swift }}
      plugins: ${{ steps.paths.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        run: python3 scripts/ci.py >> "$GITHUB_OUTPUT"

  server:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: needs.changes.outputs.server == 'true'
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            packages/*/go.sum
      - name: Vet
        if: needs.changes.outputs.server == 'true'
        run: |
          (cd apps/server && go vet -tags sqlite_fts5 ./...)
          for package in runtime memory search vault; do
            (cd "packages/$package" && GOWORK=off go vet ./...)
          done
      - name: Test (race, evals included)
        if: needs.changes.outputs.server == 'true'
        run: |
          scripts/test.sh server -race -count=1 -timeout=600s ./...
          scripts/test.sh packages -race -count=1 -timeout=600s ./...
      - name: Verification fixture
        if: needs.changes.outputs.server == 'true'
        working-directory: apps/server
        run: go test -tags 'sqlite_fts5 verifyfixture' -count=1 ./internal/fixture
      - name: Server unchanged
        if: needs.changes.outputs.server != 'true'
        run: echo 'No server inputs changed; retain a successful server check for the deployer.'

  plugins:
    needs: changes
    if: needs.changes.outputs.plugins == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugins/go.mod
          cache-dependency-path: plugins/go.sum
      - name: Vet
        working-directory: plugins
        run: GOWORK=off go vet ./...
      - name: Test (race)
        run: scripts/test.sh plugins -race -count=1 -timeout=600s ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: |
            apps/server/go.sum
            packages/*/go.sum
      - run: python3 contracts/generate.py --check
      - run: scripts/test.sh tools
      - name: Shell and workflow checks
        run: |
          shellcheck -x -P SCRIPTDIR -S warning scripts/*.sh plugins/scripts/*.sh plugins/hub/prepare.sh
          GOWORK=off go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
      - name: Control candidate contracts (no GUI input)
        run: swift test --package-path tools/control --scratch-path .build/control
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Control candidate shared transport (no GUI input)
        run: node --test tools/control/client.test.mjs
      - run: python3 scripts/testflight_test.py
      - name: Build the macOS and iOS app
        run: scripts/check.sh all
      - name: Native renderer and input checks
        run: |
          scripts/test-avatar.sh
          scripts/test-window.sh
          python3 -B apps/Polymux/Tests/InputTests/check_focus.py
