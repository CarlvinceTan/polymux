name: Site

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: polymux-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.paths.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        run: python3 scripts/ci.py >> "$GITHUB_OUTPUT"
      - name: Promotion baseline ${{ steps.paths.outputs.promotion_base }}
        run: ':'

  verify:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # Keep browser libraries and fonts in sync with the Playwright lockfile.
    container: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci --prefix apps/site
      - run: echo "POLYMUX_SITE_REGISTRY=$GITHUB_WORKSPACE/plugins/index.json" >> "$GITHUB_ENV"
      - run: npm run verify --prefix apps/site
      - run: npm run test:responsive --prefix apps/site
