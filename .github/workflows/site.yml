name: Site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/**"
  push:
    branches: [main, dev]
    paths:
      - "apps/site/**"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: polymux-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci --prefix apps/site
      - run: npm run verify --prefix apps/site
      - run: npm exec --prefix apps/site -- playwright install --with-deps webkit chromium
      - run: npm run test:responsive --prefix apps/site
