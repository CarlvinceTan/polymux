name: Site

on:
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/**"
      - "apps/Polymux/Polymux.xcodeproj/project.pbxproj"
  push:
    branches: [main, dev]
    paths:
      - "apps/site/**"
      - ".github/workflows/**"
      - "apps/Polymux/Polymux.xcodeproj/project.pbxproj"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: polymux-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Keep browser libraries and fonts in sync with the Playwright lockfile.
    container: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci --prefix apps/site
      - run: npm run verify --prefix apps/site
      - run: npm run test:responsive --prefix apps/site
