# Tauri releases are cut from app-v* tags. Workflow dispatch is a dry run: it
# builds the app and uploads the DMG without creating a GitHub release.
name: Release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/tests.yml

  tauri:
    uses: ./.github/workflows/tauri.yml

  macos:
    needs: [verify, tauri]
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.build/tauri
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          test -n "$VERSION" || { echo "The Tauri version is missing."; exit 1; }
          case "$VERSION" in *-*) echo "Only stable versions can be released."; exit 1 ;; esac
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "$GITHUB_REF_NAME" = "app-v$VERSION" || {
              echo "Tag $GITHUB_REF_NAME does not match the Tauri version $VERSION."
              exit 1
            }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=app-v$VERSION" >> "$GITHUB_ENV"

      - name: Install locked dependencies
        run: npm ci --prefix apps/tauri

      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CERT_P12 CERT_PASSWORD TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          umask 077
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/polymux.p12"
          KEYCHAIN="$RUNNER_TEMP/polymux-signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/polymux.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)
          test -n "$IDENTITY" || { echo "No Developer ID Application identity was imported."; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "POLYMUX_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/polymux.p12"

      - name: Build app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run tauri --prefix apps/tauri -- build --bundles app
          test -d "$CARGO_TARGET_DIR/release/bundle/macos/Polymux.app"

      - name: Notarize and staple app
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          APP="$CARGO_TARGET_DIR/release/bundle/macos/Polymux.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Polymux-app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Polymux-app.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      - name: Create DMG
        run: |
          APP="$CARGO_TARGET_DIR/release/bundle/macos/Polymux.app"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/Polymux.app"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          DMG="dist/Polymux-$VERSION-arm64.dmg"
          hdiutil create -volname "Polymux" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
            codesign --verify --verbose=2 "$DMG"
          fi
          hdiutil verify "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "$name is missing."; exit 1; }
          done
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Create signed updater feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is missing."; exit 1; }
          APP="$CARGO_TARGET_DIR/release/bundle/macos/Polymux.app"
          TARBALL="dist/Polymux.app.tar.gz"
          tar -czf "$TARBALL" -C "$(dirname "$APP")" Polymux.app
          npm run tauri --prefix apps/tauri -- signer sign --app-version "$VERSION" "$TARBALL"
          test -s "$TARBALL.sig"
          URL="https://github.com/CarlvinceTan/polymux/releases/download/updates/Polymux.app.tar.gz"
          python3 - "$VERSION" "$TARBALL.sig" "$URL" <<'PY'
          import datetime, json, sys
          version, signature_path, url = sys.argv[1], sys.argv[2], sys.argv[3]
          signature = open(signature_path).read().strip()
          data = {
              "version": version,
              "notes": f"Polymux {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {"signature": signature, "url": url},
              },
          }
          json.dump(data, open("dist/latest.json", "w"), indent=2)
          PY
          cat dist/latest.json

      - name: Checksum
        run: |
          NAME="Polymux-$VERSION-arm64.dmg"
          (cd dist && shasum -a 256 "$NAME" > "$NAME.sha256")
          echo "ARTIFACT=dist/$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: Polymux-${{ env.VERSION }}-macOS
          path: |
            dist/Polymux-${{ env.VERSION }}-arm64.dmg
            dist/Polymux-${{ env.VERSION }}-arm64.dmg.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Polymux-${{ env.VERSION }}-updater
          path: |
            dist/Polymux.app.tar.gz
            dist/Polymux.app.tar.gz.sig
            dist/latest.json
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" --clobber
            gh release edit "$TAG" --title "Polymux $VERSION" --latest
          else
            gh release create "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" \
              --title "Polymux $VERSION" --verify-tag --latest
          fi
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --title "Polymux updates" --notes "Signed update feed." --latest=false
          fi
          gh release upload updates dist/Polymux.app.tar.gz dist/Polymux.app.tar.gz.sig dist/latest.json --clobber
